<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <title>Todo list</title>
</head>
<body>
  <div class="container m-3">
    <form class="form-inline" id="todo-form">
      <input type="text" required="required" class="form-control mr-3" name="name" id="task-input" placeholder="Введите задачу...">
      <button type="submit" class="btn btn-primary mr-3">add</button>
    </form>
    <ul id="tasks" class="list-group" aria-label="Tasks"></ul>
  </div>

  <script>
    // Получаем элементы DOM
    const form = document.getElementById('todo-form');
    const taskInput = document.getElementById('task-input');
    const tasksList = document.getElementById('tasks');

    // Функция для создания элемента задачи
    function createTaskItem(taskText) {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center';

      // Текст задачи
      const span = document.createElement('span');
      span.textContent = taskText;

      // Кнопка удаления
      const deleteBtn = document.createElement('button');
      deleteBtn.textContent = 'Удалить';
      deleteBtn.className = 'btn btn-danger btn-sm';
      deleteBtn.addEventListener('click', () => {
        li.remove(); // удаляем задачу из списка
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      return li;
    }

    // Обработчик отправки формы
    form.addEventListener('submit', (event) => {
      event.preventDefault(); // отменяем перезагрузку страницы
      const taskText = taskInput.value.trim();
      if (taskText === '') return;

      const taskItem = createTaskItem(taskText);
      tasksList.appendChild(taskItem);

      // Очищаем поле ввода и возвращаем фокус
      taskInput.value = '';
      taskInput.focus();
    });
  </script>
</body>
</html>
