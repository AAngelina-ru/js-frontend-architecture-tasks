<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-WskhaSGFgHYWDcbwN70/dfYBj47jz9qbsMId/iRN3ewGhXQFZCSftd1LZCfmhktB" crossorigin="anonymous">
</head>

<body>
  <div class="container m-3">
    <div class="row">
      <div class="col-6">
        <form id="filterForm">
          <div>
            <label>
              Processor
              <select name="processor_eq">
                <option value="">Select</option>
                <option value="intel">Intel</option>
                <option value="amd">AMD</option>
              </select>
            </label>
          </div>
          <div>
            <label>
              Memory (GB)
              <select name="memory_eq">
                <option value="">Select</option>
                <option value="8">8</option>
                <option value="16">16</option>
                <option value="32">32</option>
              </select>
            </label>
          </div>
          <div>
            <label>
              Frequency Min (GHz)
              <input type="number" name="frequency_gte" min="1" max="5" step="0.1" value="">
            </label>
          </div>
          <div>
            <label>
              Frequency Max (GHz)
              <input type="number" name="frequency_lte" min="1" max="5" step="0.1" value="">
            </label>
          </div>
        </form>
      </div>
      <div class="col-6">
        <div class="result row"></div>
      </div>
    </div>
  </div>

  <script>
    // Данные товаров (ноутбуков)
    const products = [
      { id: 1, name: "Acer Swift 3", processor: "intel", memory: 8, frequency: 2.4 },
      { id: 2, name: "Asus ZenBook", processor: "intel", memory: 16, frequency: 2.8 },
      { id: 3, name: "HP Pavilion", processor: "amd", memory: 8, frequency: 3.0 },
      { id: 4, name: "Dell XPS", processor: "intel", memory: 32, frequency: 3.2 },
      { id: 5, name: "Lenovo Legion", processor: "amd", memory: 16, frequency: 3.5 },
      { id: 6, name: "Apple MacBook", processor: "intel", memory: 16, frequency: 2.6 },
      { id: 7, name: "MSI Modern", processor: "amd", memory: 32, frequency: 2.9 },
      { id: 8, name: "Razer Blade", processor: "intel", memory: 16, frequency: 3.8 }
    ];

    // Получение элементов формы
    const form = document.getElementById('filterForm');
    const processorSelect = form.querySelector('[name="processor_eq"]');
    const memorySelect = form.querySelector('[name="memory_eq"]');
    const freqMinInput = form.querySelector('[name="frequency_gte"]');
    const freqMaxInput = form.querySelector('[name="frequency_lte"]');
    const resultContainer = document.querySelector('.result');

    // Функция фильтрации
    function filterProducts() {
      const selectedProcessor = processorSelect.value;
      const selectedMemory = memorySelect.value;
      const freqMin = freqMinInput.value === '' ? -Infinity : parseFloat(freqMinInput.value);
      const freqMax = freqMaxInput.value === '' ? Infinity : parseFloat(freqMaxInput.value);

      return products.filter(product => {
        // Фильтр по процессору
        if (selectedProcessor && product.processor !== selectedProcessor) return false;
        // Фильтр по памяти
        if (selectedMemory && product.memory !== parseInt(selectedMemory)) return false;
        // Фильтр по минимальной частоте
        if (product.frequency < freqMin) return false;
        // Фильтр по максимальной частоте
        if (product.frequency > freqMax) return false;
        return true;
      });
    }

    // Функция отображения результатов
    function renderResults() {
      const filtered = filterProducts();
      
      if (filtered.length === 0) {
        resultContainer.innerHTML = `<div class="col-12"><div class="alert alert-info">No products match your criteria.</div></div>`;
        return;
      }

      resultContainer.innerHTML = filtered.map(product => `
        <div class="col-md-6 mb-3">
          <div class="card h-100">
            <div class="card-body">
              <h5 class="card-title">${product.name}</h5>
              <p class="card-text">
                <strong>Processor:</strong> ${product.processor.toUpperCase()}<br>
                <strong>Memory:</strong> ${product.memory} GB<br>
                <strong>Frequency:</strong> ${product.frequency} GHz
              </p>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Добавляем обработчики событий на все поля формы
    const formControls = [processorSelect, memorySelect, freqMinInput, freqMaxInput];
    formControls.forEach(control => {
      control.addEventListener('change', renderResults);
      control.addEventListener('input', renderResults);
    });

    // Первоначальный рендеринг
    renderResults();
  </script>
</body>

</html>
